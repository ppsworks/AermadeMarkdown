[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-md-converter"
version = "0.1.0"
description = "A scalable file-to-Markdown conversion framework for LLM-friendly document mirrors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markitdown[all]",
    "pymupdf4llm",
    "python-frontmatter",
]

[project.scripts]
md-convert = "md_converter.main:main"

[tool.setuptools.packages.find]
where = ["src"]