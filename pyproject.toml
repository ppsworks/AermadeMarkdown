[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-md-converter"
version = "0.1.0"
description = "Converts office documents, PDFs, email and HTML to Markdown for AI-agent grounding material."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markitdown[all]",
    "pymupdf4llm",
    "python-frontmatter",
    "msal",
    "requests",
    "python-dotenv",
]

[project.scripts]
md-convert = "md_converter.main:main"
md-convert-sp = "md_converter.sharepoint.sync:main"

[tool.setuptools.packages.find]
where = ["src"]